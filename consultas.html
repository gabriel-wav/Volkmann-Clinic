<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="assets/js/footer.js" defer></script>
    <script src="assets/js/header.js" defer></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/consultas.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <title>Consultas - Clinica Volkmann</title>
</head>
<body>
    <header>
    <div id="header"></div>
</header>

    <main class="main-consultas">
        <section class="container-pai">
            <div class="container-form">
                <h2>AGENDAR CONSULTA</h2>
                <form action="index.html">
                    <div class="caixa-input">
                        <label for="especialidade">ESPECIALIDADE:</label>
                        <input type="text" id="especialidade" name="especialidade" required>
                    </div>

                    <div class="caixa-input">
                        <label for="medico">MÉDICO:</label>
                        <input type="text" id="medico" name="medico" required>
                    </div>

                    <div class="caixa-input">
                        <label for="data">DATA:</label>
                        <input type="date" id="data" name="data" required>
                    </div>

                    <div class="caixa-input">
                        <label for="endereco">ENDEREÇO:</label>
                        <input type="text" id="endereco" name="endereco" required>
                    </div>

                    <div class="caixa-input">
                        <label for="convenio">SELECIONE SEU CONVÊNIO:</label>
                        <input type="text" id="convenio" name="convenio">
                    </div>

                    <div class="botoes">
                        <button type="submit" class="botao-primario">MARCAR CONSULTA</button>
                        <button type="button" class="botao-secundario">
                            WHATSAPP <img src="assets/img/logo-whatsapp.jpg" alt="Logo WhatsApp" class="icone-whatsapp" loading="lazy">
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer>
    <div id="footer"></div>
</footer>
</body>
</html>

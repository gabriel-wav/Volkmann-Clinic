<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="assets/js/footer.js" defer></script>
    <script src="assets/js/header.js" defer></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <title>Cadastro - Clinica Volkmann</title>
</head>
<body>
    <header>
    <div id="header"></div>
</header>

    <main class="container-pai">
        <h1 class="texto-agende-conosco">CADASTRAR</h1>

        <div class="container-filho">
            <div class="form-wrapper">
                <form class="inputs-container" action="login.html">
                    <div class="input-row">
                        <div class="caixa-input">
                            <label for="nome">NOME COMPLETO:</label>
                            <input type="text" id="nome" name="nome" placeholder="NOME" required>
                        </div>
                    </div>
                    
                    <div class="input-row">
                        <div class="caixa-input">
                            <label for="cpf">CPF:</label>
                            <input type="text" id="cpf" name="cpf" placeholder="CPF" required>
                        </div>
                        <div class="caixa-input">
                            <label for="datanascimento">DATA DE NASCIMENTO:</label>
                            <input type="date" id="datanascimento" name="datanascimento" required>
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="caixa-input">
                            <label for="email">E-MAIL:</label>
                            <input type="email" id="email" name="email" placeholder="E-MAIL" required>
                        </div>
                        <div class="caixa-input">
                            <label for="celular">NÚMERO DE CELULAR:</label>
                            <input type="tel" id="celular" name="celular" placeholder="(DD) 9XXXX-XXXX" required>
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="caixa-input">
                            <label for="senha">CRIE SUA SENHA:</label>
                            <input type="password" id="senha" name="senha" placeholder="SENHA" required>
                        </div>
                        <div class="caixa-input">
                            <label for="confirmesenha">CONFIRME SUA SENHA:</label>
                            <input type="password" id="confirmesenha" name="confirmesenha" placeholder="CONFIRME A SENHA" required>
                        </div>
                    </div>

                    <div class="container-botoes">
                        <button type="submit" class="botao-acao">CONCLUIR</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
    <div id="footer"></div>
</footer>
</body>
</html>

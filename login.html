<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="assets/js/footer.js" defer></script>
    <script src="assets/js/header.js" defer></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Login</title>
</head>

<body>
    <header>
    <div id="header"></div>
</header>

    <main class="container-pai">
        <h1 class="texto-agende-conosco">AGENDE CONOSCO</h1>

        <div class="container-filho">
            <div class="nao-tenho-cadastro">
                <span class="texto-nao">NÃO TENHO CADASTRO</span>
                <span class="texto-ja">JÁ TENHO CADASTRO</span>
            </div>

            <div class="form-wrapper">
                <div class="texto-sem-contorno">
                    <span class="se-essa">Se essa é a primeira vez que <br class="hidden-mobile"> você realiza o acesso à <br class="hidden-mobile"> plataforma, clique no botão <br class="hidden-mobile"> ABAIXO.</span>
                </div>

                <form class="inputs-container" action="index.html">
                    <div class="caixa-input">
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" name="cpf" placeholder="CPF" required>
                    </div>

                    <div class="caixa-input">
                        <label for="senha">SENHA:</label>
                        <input type="password" id="senha" name="senha" placeholder="SENHA" required>
                    </div>
                </form>
            </div>

            <div class="container-botoes">
                <a class="botao-acao" href="cadastro.html">CADASTRE-SE</a>
                <a class="texto-esqueceu-senha" href="esqueceuasenha.html">Esqueceu a senha?</a>
                <a class="botao-acao" href="index.html">ENTRAR</a>
            </div>
        </div>
    </main>

    <footer>
    <div id="footer"></div>
</footer>

</body>

</html>
